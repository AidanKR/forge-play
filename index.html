<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>공방 디펜스</title>
<!-- 홈 화면에 추가하면 앱처럼 열린다(주소창 없음). 아이콘은 코드로 그린 그림(web/icons). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1c24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공방 디펜스">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; background: #1a1c24; color: #eee; overflow: hidden; touch-action: none; }
  #game { width: 100%; height: 100%; display: block; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 18px -apple-system, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="loading">불러오는 중…<br>(처음엔 조금 걸려요)</div>
<canvas id="game"></canvas>
<script>
  // 브라우저는 사람이 한 번 건드리기 전엔 소리를 막는다. 게임이 만든 오디오 장치를 기억해 두었다가
  // 첫 터치·클릭·키 입력 때 깨운다.
  (function () {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    const made = [];
    const Wrapped = function (...args) { const c = new Ctor(...args); made.push(c); return c; };
    Wrapped.prototype = Ctor.prototype;
    window.AudioContext = Wrapped;
    window.__forgeAudio = made;
    const wake = () => made.forEach((c) => { if (c.state !== "running") c.resume(); });
    ["pointerdown", "touchend", "mousedown", "keydown", "click"].forEach((e) => addEventListener(e, wake, { capture: true }));
  })();
</script>
<script type="module">
  import init from "./pkg/forge-app.js?v=52cf446";
  init().catch((e) => {
    // Bevy는 이벤트 루프를 예외로 넘기므로 이 메시지는 정상일 수 있다.
    if (!String(e).includes("Using exceptions for control flow")) {
      document.getElementById("loading").textContent = "실행 실패: " + e;
      throw e;
    }
  });
  // 첫 화면 시간 재기: 게임이 화면을 잡은 순간(performance.getEntriesByName("first-screen")).
  const hide = () => {
    const l = document.getElementById("loading");
    if (l) {
      performance.mark("first-screen");
      l.remove();
    }
  };
  new MutationObserver(hide).observe(document.getElementById("game"), { attributes: true });
</script>
</body>
</html>
